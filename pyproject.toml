[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schwab-trader"
version = "0.1.0"
description = "Personal-use Charles Schwab trading application with strong risk controls."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "kyles05git" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "truststore>=0.9",
    "anthropic>=0.40",
    "SQLAlchemy>=2.0.36,<3",
    "psycopg[binary]>=3.2,<4",
    # 1.19.1 is the floor, not a preference: earlier Alembic never diffed CHECK
    # constraints during autogenerate, so the migration/model parity suite silently
    # passed against a schema whose constraint names had drifted. A lower local pin
    # than CI's resolution is what let that drift reach `main` unnoticed.
    "alembic>=1.19.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

postgres = [
    "pytest-postgresql>=6.1",
]

[project.scripts]
schwab-trader = "schwab_trader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# typer builds CLI options via these call factories in argument defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["truststore"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
